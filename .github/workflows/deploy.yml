name: Deploy Status Page

on:
  push:
    branches:
      - master  # Change to 'main' if that's your default branch
    paths:
      - 'api/**'
      - 'history/**'
      - 'graphs/**'
      - 'summary.json'
      - '.upptimerc.yml'
      - 'README.md'

  schedule:
    - cron: '*/5 * * * *'  # Optional: Rebuild every 5 minutes

  workflow_dispatch:  # Allow manual runs

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Upptime CLI
        run: npm install -g upptime

      - name: Generate site
        run: upptime site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
